# Reference template: every VitsModel parameter worth tuning, with its
# current code default and a note on what it actually trades off. Copy this
# file, uncomment/edit what you want to change, delete the rest -- anything
# left out just keeps its code default. Pass with:
#   python -m banhmi_train.train --dataset-dir <dir> --config configs/your-file.yaml ...
#
# Values here override --quality and every CLI flag (see train.py).

# ------------------------------------------------------------------------
# Part of the EXPORTED model (real inference speed/quality tradeoff)
# ------------------------------------------------------------------------
# hidden_channels: 192          # TextEncoder/PosteriorEncoder/Flow/DurationPredictor width
# inter_channels: 192           # the latent "bandwidth" feeding the Generator -- shrinking
                                 # this (unlike hidden_channels) narrows what actually reaches
                                 # the vocoder. Neither original VITS nor VITS2's own LJSpeech
                                 # configs go below 192; no evidence to go lower.
# filter_channels: 768          # TextEncoder's FFN width (keep as ~4x hidden_channels)
# n_layers: 6                   # TextEncoder self-attention depth -- every Piper quality
                                 # tier (x-low/medium/high) keeps this at 6; not a validated
                                 # lever, and TextEncoder is cheap relative to the Generator
                                 # anyway (runs at phoneme-rate, not audio-sample-rate).
# n_heads: 2

# Generator (the actual vocoder -- dominates real inference time, since it
# runs at audio-sample-rate while everything else above runs at phoneme- or
# frame-rate). Not exposed as individual --flags, only as awkward tuples;
# only settable here or via --quality x-low/medium/high:
# resblock: "2"                          # "1" = more dilations (heavier, higher quality)
# resblock_kernel_sizes: [3, 5, 7]
# resblock_dilation_sizes: [[1, 2], [2, 6], [3, 12]]
# upsample_rates: [8, 8, 4]              # 3 stages; high quality uses 4: [8, 8, 2, 2]
# upsample_initial_channel: 256          # both original VITS and VITS2's own LJSpeech
                                          # reference configs use 512 (Piper's "high") here --
                                          # 256 (medium) is already a deliberately lighter,
                                          # Piper-community-validated departure from the
                                          # academic baseline. No published config goes lower.
# upsample_kernel_sizes: [16, 16, 8]
# use_snake_beta: true                   # SnakeBeta (separate learnable alpha/beta) instead
                                          # of EdgeTTS's plain Snake1d -- BanhmiTTS-only
                                          # addition (EdgeTTS's own README confirms Snake1d,
                                          # not SnakeBeta). false = exact EdgeTTS match.

# Flow (ResidualCouplingBlock) -- part of the exported model:
# flow_n_flows: 4
# flow_kernel_size: 5
# flow_dilation_rate: 1
# use_transformer_flows: true    # VITS2-style self-attention per flow step (matches VITS2's
                                  # own reference config). false = plain WN-only flow (lighter,
                                  # matches vanilla VITS/Piper baseline).

# VITS2's noise-scaled MAS -- training-only (alignment search never runs
# at inference), decays linearly to 0 over global_step so it only affects
# early-training alignment exploration, not the converged model. Not in
# EdgeTTS at all (a real gap there, unlike transformer_flows/duration
# discriminator which EdgeTTS has unconditionally).
# use_noise_scaled_mas: false     # true to enable (BanhmiTTS default is off)
# mas_noise_scale_initial: 0.01   # matches VITS2 reference; decays to 0 by step 5000
# mas_noise_scale_decay: 0.000002

# ------------------------------------------------------------------------
# Training-only (discarded before ONNX export -- zero effect on the
# deployed model, only trades off training speed/memory)
# ------------------------------------------------------------------------
# posterior_encoder_layers: 12   # WaveNet depth inside PosteriorEncoder (enc_q)
# posterior_encoder_kernel_size: 5
# posterior_encoder_dilation_rate: 1
# use_mrd: true                  # UnivNet-style multi-resolution STFT discriminator
# use_duration_discriminator: true  # VITS2-style duration discriminator

# ------------------------------------------------------------------------
# Pure data-loading / bookkeeping -- zero effect on model quality
# ------------------------------------------------------------------------
# num_workers: 1                 # raise this (e.g. to your CPU core count) for faster
                                  # data loading; pure parallelism, no quality tradeoff.
# max_phoneme_ids:               # drop utterances with more phoneme ids than this

# ------------------------------------------------------------------------
# Data split -- train / val / test, fixed counts (not fractions -- LJSpeech's
# size is permanently known, so a hardcoded absolute split is as valid as a
# percentage). test is held out until trainer.test() runs once after
# training finishes; val is checked throughout training.
# ------------------------------------------------------------------------
# num_val_examples: 500           # checked periodically during training
# num_test_examples: 500          # never touched until the very end
# num_audio_samples: 5            # *validation* utterances logged as listenable
                                   # audio during training -- not a metric

# ------------------------------------------------------------------------
# Standard VITS training hyperparameters -- validated on LJSpeech by both
# the original VITS and VITS2 papers; no dataset-specific reason to change.
# ------------------------------------------------------------------------
# c_mel: 45
# c_kl: 1.0
